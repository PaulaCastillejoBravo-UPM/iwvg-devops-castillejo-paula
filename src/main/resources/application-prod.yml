logging:
  level:
    root: WARN
    es.upm.api: INFO

springdoc:
  api-docs:
    enabled: true # Disable for delivery. false
  swagger-ui:
    enabled: true # Disable for delivery. false

app:
  hosting: AWS

spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/devopsdb_umn6
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}